server {
    listen 8080;
    host 127.0.0.1;

    client_max_body_size 128000000;

    error_page 400 www/errors/400.html;
    error_page 403 www/errors/403.html;
    error_page 404 www/errors/404.html;
    error_page 405 www/errors/405.html;
    error_page 409 www/errors/409.html;
    error_page 415 www/errors/415.html;
    error_page 500 www/errors/500.html;
    error_page 501 www/errors/501.html;
    error_page 502 www/errors/502.html;
    error_page 504 www/errors/504.html;

    location / {
        methods GET;
        root YoupiBanane;
        index index.html;
        autoindex off;
    }

    location /directory {
        methods GET POST;
        root YoupiBanane;
        index youpi.bad_extension;
        autoindex off;
        # CGI interpreter paths must be absolute. Update this if the checkout moves.
        cgi_ext .bla /home/skully/projects/42_Webserv/test/cgi_tester;
    }

    location /post_body {
        methods POST;
        root www;
        autoindex on;
        client_max_body_size 100;
    }

    location /bench {
        methods GET;
        root test/defense/site;
        index index.html;
    }
}

server {
    host 127.0.0.1;
    listen 8088;
    client_max_body_size 10M;
    error_page 404 test/defense/site/404.html;

    location / {
        methods GET;
        root test/defense/site;
        index index.html;
    }
    location /catalog {
        methods GET;
        root test/defense/files;
        autoindex on;
    }
    location /moved {
        methods GET;
        return 301 /catalog/sample.txt;
    }
    location /echo {
        methods POST;
        root test/defense/site;
        client_max_body_size 32;
    }
    location /uploads {
        methods GET POST DELETE;
        root test/defense/uploads;
        upload_enable on;
        upload_store test/defense/uploads;
    }
    location /readonly {
        methods GET;
        root test/defense/uploads;
    }
    location /cgi {
        methods GET POST;
        root test/defense/cgi;
        cgi_ext .py /usr/bin/python3;
        cgi_ext .sh /bin/bash;
    }
}

server {
    host 127.0.0.1;
    listen 8089;

    location /tools {
        methods GET;
        root test/defense/site;
        index manual.html;
    }
    location / {
        methods GET;
        root test/defense/secondary;
        index index.html;
    }
}
