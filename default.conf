server {
    listen 8080;    #this is the main port
    host 127.0.0.1;
    
    client_max_body_size 20M;
    
    error_page 400 www/errors/400.html;
    error_page 403 www/errors/403.html;
    error_page 404 www/errors/404.html;
    error_page 405 www/errors/405.html;
    error_page 409 www/errors/409.html;
    error_page 415 www/errors/415.html;
    error_page 500 www/errors/500.html;
    error_page 501 www/errors/501.html;
    error_page 502 www/errors/502.html;
    error_page 504 www/errors/504.html;

    location / {
        methods GET;
        root www;
        index index.html;
        autoindex on;
    } 
    
    location /uploads {
        methods GET POST DELETE;
        root www/uploads;
        upload_enable on;
        upload_store www/uploads/test;
        autoindex on;
    }

    location /old-page {
        methods GET;
        return 301 /;
    }

    location /cgi-bin {
        methods GET POST;
        root www/cgi-bin;
        
        cgi_ext .py /usr/bin/python3;
        cgi_ext .sh /bin/bash;
    }
}

server {
	server_name youpi
	listen 0.0.0.0:8000

	root ./YoupiBanane
	index index.html

	allow_methods GET

	location /put_test {
		allow_methods PUT
		root ./YoupiBanane/put_here
		alias
	}

	location /post_body {
		allow_methods POST
		client_body_buffer_size 100
	}

	location /directory {
		alias
		allow_methods GET
		root YoupiBanane/
		index youpi.bad_extension

		location *.bla {
			allow_methods GET POST
			cgi_pass /ubuntu_cgi_tester
		}
	}

	location *.bla {
		allow_methods POST
		cgi_pass test_linux/ubuntu_cgi_tester
	}
}