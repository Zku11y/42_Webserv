server {
    listen 8080;
    host 127.0.0.1;
    server_name webserv.local;
    
    client_max_body_size 20M;
    
    error_page 400 www/errors/400.html;
    error_page 403 www/errors/403.html;
    error_page 404 www/errors/404.html;
    error_page 405 www/errors/405.html;
    error_page 500 www/errors/500.html;

    location / {
        methods GET;
        root www;
        index index.html;
        autoindex on;
    }

    location /upload {
        methods GET POST DELETE;
        root www/uploads;
        upload_enable on;
        upload_store www/uploads;
        autoindex on;
    }

    location /old-page {
        methods GET;
        return 301 /;
    }

    location /cgi-bin {
        methods GET POST;
        root www/cgi-bin;
        
        cgi_ext .py /usr/bin/python3;
        cgi_ext .sh /bin/bash;
    }
}

server {
    listen 8081;
    host 127.0.0.1;
    server_name test.local;
    
    client_max_body_size 5M;

    location / {
        methods GET POST;
        root www;
        index index2.html;
        autoindex off;
    }
}
