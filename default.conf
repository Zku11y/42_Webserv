server {
    listen 8080;    #this is the main port
    host 127.0.0.1;
    server_name webserv.local;
    
    client_max_body_size 20M;
    
    error_page 400 www/errors/400.html;
    error_page 404 www/errors/404.html;


    location / {
        methods GET;
        root www;
        index index.html;
        autoindex on;
    }
    
    location /uploads {
        methods GET POST DELETE;
        root www;
        upload_enable on;
        upload_store www;
        autoindex on;
    }
    
    location /uploads/test {
        methods GET POST DELETE;
        root www;
    }

    location /old-page {
        methods GET;
        return 301 /;
    }

    location /cgi-bin {
        methods GET POST;
        root www;
        
        cgi_ext .py /usr/bin/python3;
        cgi_ext .sh /bin/bash;
    }
}

server {
    listen 8081;
    host 127.0.0.1;
    server_name test.local;
    
    client_max_body_size 5M;

    location / {
        methods GET POST;
        root www;
        index index2.html;
        autoindex off;
    }
}
# end of file